<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Clément Delemotte — Photographe & Vidéaste</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Montserrat:wght@300;400;500&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --black: #0d2818;
      --white: #f5f8f5;
      --grey-light: #e8f0e9;
      --grey-mid: #4a7a56;
      --grey-dark: #1a3d28;
      --accent: #1e6b3a;
      --serif: 'Cormorant Garamond', serif;
      --sans: 'Montserrat', sans-serif;
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--white);
      color: var(--black);
      font-family: var(--sans);
      font-weight: 300;
      overflow-x: hidden;
    }

    /* HERO SECTION - Inspiré Kim Tracey */
    #hero {
      position: relative;
      width: 100%;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #1a1a1a 0%, #2a2a2a 50%, #0f0f0f 100%);
      overflow: hidden;
      padding: 2rem;
    }

    #hero::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image: 
        radial-gradient(circle at 20% 50%, rgba(30, 107, 58, 0.08) 0%, transparent 50%),
        radial-gradient(circle at 80% 80%, rgba(30, 107, 58, 0.05) 0%, transparent 50%);
      pointer-events: none;
      z-index: 1;
    }

    .hero-container {
      position: relative;
      z-index: 2;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2rem;
    }

    /* Logo minimaliste en haut */
    .logo-monogram {
      width: 100px;
      height: 100px;
      border: 2px solid var(--white);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--serif);
      font-size: 3.5rem;
      font-weight: 300;
      color: var(--white);
      letter-spacing: 0.1em;
      opacity: 0.95;
      margin-bottom: 1rem;
    }

    /* Nom avec police géométrique type Dune */
    .hero-name {
      font-family: 'Space Mono', monospace;
      font-size: clamp(2.2rem, 7vw, 5rem);
      font-weight: 700;
      letter-spacing: 0.15em;
      color: var(--white);
      text-transform: uppercase;
      text-shadow: 0 4px 25px rgba(30, 107, 58, 0.4);
      line-height: 1.1;
      margin: 0;
    }

    /* Sous-titre: Photographe & Vidéaste */
    .hero-role {
      font-family: var(--sans);
      font-size: 0.85rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.85);
      margin-bottom: 2rem;
      font-weight: 300;
    }

    /* Baseline principale */
    .hero-tagline {
      font-family: var(--serif);
      font-size: clamp(1.8rem, 5vw, 4rem);
      font-weight: 300;
      font-style: italic;
      color: var(--white);
      letter-spacing: 0.02em;
      line-height: 1.2;
      text-shadow: 0 2px 15px rgba(0, 0, 0, 0.5);
      max-width: 600px;
      margin: 1.5rem 0;
    }

    /* Divider */
    .divider {
      width: 80px;
      height: 1px;
      background: linear-gradient(to right, transparent, var(--accent), transparent);
      margin: 2rem auto;
    }

    /* Localisation */
    .hero-location {
      font-family: var(--sans);
      font-size: 0.7rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.75);
      margin-top: 1.5rem;
    }

    /* Scroll indicator */
    .scroll-indicator {
      position: absolute;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.8rem;
      cursor: pointer;
      z-index: 3;
      animation: float 2s ease-in-out infinite;
    }

    .scroll-dot {
      width: 10px;
      height: 10px;
      border: 1.5px solid var(--accent);
      border-radius: 50%;
    }

    .scroll-text {
      font-size: 0.6rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--accent);
    }

    @keyframes float {
      0%, 100% { transform: translateX(-50%) translateY(0); }
      50% { transform: translateX(-50%) translateY(12px); }
    }

    /* NAV */
    nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 2rem 4rem;
      background: rgba(245, 248, 245, 0.92);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(13, 40, 24, 0.08);
    }

    .nav-logo {
      font-family: var(--serif);
      font-size: 1.2rem;
      font-weight: 300;
      letter-spacing: 0.05em;
      color: var(--black);
      text-decoration: none;
    }

    .nav-links {
      display: flex;
      gap: 2.5rem;
      list-style: none;
    }

    .nav-links a {
      font-size: 0.65rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--black);
      text-decoration: none;
      opacity: 0.6;
      transition: opacity 0.3s;
    }

    .nav-links a:hover {
      opacity: 1;
    }

    /* PORTFOLIO */
    #portfolio {
      background: var(--white);
      padding: 8rem 4rem;
    }

    .portfolio-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-bottom: 4rem;
    }

    .section-label {
      font-size: 0.6rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 1rem;
    }

    .section-title {
      font-family: var(--serif);
      font-size: clamp(2.5rem, 4vw, 4.5rem);
      font-weight: 300;
      line-height: 1.05;
      letter-spacing: -0.01em;
    }

    .portfolio-tabs {
      display: flex;
      gap: 2rem;
    }

    .tab-btn {
      background: none;
      border: none;
      font-family: var(--sans);
      font-size: 0.65rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--grey-mid);
      cursor: pointer;
      padding-bottom: 0.5rem;
      border-bottom: 1px solid transparent;
      transition: color 0.3s, border-color 0.3s;
    }

    .tab-btn.active,
    .tab-btn:hover {
      color: var(--black);
      border-color: var(--accent);
    }

    .portfolio-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.8rem;
    }

    .photo-card {
      background: var(--grey-dark);
      overflow: hidden;
      position: relative;
      height: 360px;
    }

    .photo-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }

    .photo-card:hover img {
      transform: scale(1.04);
    }

    .photo-card::after {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      opacity: 0;
      transition: opacity 0.4s;
    }

    .photo-card:hover::after {
      opacity: 1;
    }

    .photo-card .card-info {
      position: absolute;
      bottom: 1.5rem;
      left: 1.5rem;
      z-index: 2;
      opacity: 0;
      transform: translateY(8px);
      transition: opacity 0.4s, transform 0.4s;
    }

    .photo-card:hover .card-info {
      opacity: 1;
      transform: translateY(0);
    }

    .card-info h3 {
      font-family: var(--serif);
      font-size: 1.2rem;
      font-weight: 300;
      font-style: italic;
      color: var(--white);
    }

    .card-info span {
      font-size: 0.6rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--accent);
    }

    /* FOOTER */
    footer {
      background: var(--white);
      padding: 3rem 4rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 1px solid rgba(13, 40, 24, 0.1);
    }

    footer p {
      font-size: 0.6rem;
      letter-spacing: 0.15em;
      color: var(--grey-mid);
    }

    .footer-logo {
      font-family: var(--serif);
      font-size: 1.2rem;
      color: var(--black);
      opacity: 0.4;
    }

    /* ANIMATIONS */
    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .reveal {
      opacity: 1;
      transform: none;
    }

    /* RESPONSIVE */
    @media (max-width: 900px) {
      nav {
        padding: 1.5rem 2rem;
      }

      .nav-links {
        display: none;
      }

      #hero {
        padding: 2rem;
      }

      .hero-name {
        font-size: 2.5rem;
      }

      .hero-tagline {
        font-size: 2rem;
      }

      section {
        padding: 5rem 2rem;
      }

      .portfolio-grid {
        grid-template-columns: 1fr 1fr;
      }

      .photo-card {
        height: 240px;
      }

      footer {
        flex-direction: column;
        gap: 1rem;
        text-align: center;
      }
    }
  </style>
</head>
<body>
  <!-- NAV -->
  <nav>
    <a href="#hero" class="nav-logo">C.</a>
    <ul class="nav-links">
      <li><a href="#portfolio">Portfolio</a></li>
      <li><a href="#about">À propos</a></li>
      <li><a href="#services">Prestations</a></li>
      <li><a href="#contact">Contact</a></li>
    </ul>
  </nav>

  <!-- HERO -->
  <section id="hero">
    <div class="hero-container">
      <!-- Logo minimaliste -->
      <div class="logo-monogram">C</div>

      <!-- Nom avec police Dune-inspired -->
      <h1 class="hero-name">Clément<br>Delemotte</h1>

      <!-- Rôle -->
      <p class="hero-role">Photographe & Vidéaste</p>

      <!-- Divider -->
      <div class="divider"></div>

      <!-- Tagline principal -->
      <p class="hero-tagline">Capturer<br>l'émotion</p>

      <!-- Localisation -->
      <p class="hero-location">Var · Montpellier · Cape Town</p>
    </div>

    <!-- Scroll indicator -->
    <a href="#portfolio" class="scroll-indicator">
      <div class="scroll-dot"></div>
      <span class="scroll-text">Défiler</span>
    </a>
  </section>

  <!-- PORTFOLIO SECTION PLACEHOLDER -->
  <section id="portfolio">
    <div class="portfolio-header reveal">
      <div>
        <p class="section-label">01 — Portfolio</p>
        <h2 class="section-title">
          Regards<br><em style="font-family:var(--serif); font-style:italic; color:var(--grey-mid);">choisis</em>
        </h2>
      </div>
      <div class="portfolio-tabs">
        <button class="tab-btn active" data-filter="tous">Tous</button>
        <button class="tab-btn" data-filter="portrait">Portrait</button>
        <button class="tab-btn" data-filter="paysage">Paysage</button>
        <button class="tab-btn" data-filter="evenement">Événement</button>
      </div>
    </div>
    <div class="portfolio-grid reveal">
      <!-- Vos photos viendront ici -->
      <div class="photo-card" data-cat="portrait">
        <img src="https://via.placeholder.com/400x500?text=Portrait" alt="" />
        <div class="card-info">
          <h3>Portrait</h3>
          <span>Exploration</span>
        </div>
      </div>
    </div>
  </section>

  <!-- FOOTER -->
  <footer>
    <p>© 2026 Clément Delemotte — Tous droits réservés</p>
    <div class="footer-logo">C.</div>
    <p>Photographe & Vidéaste</p>
  </footer>

  <script>
    // Navigation au scroll
    document.querySelectorAll('a[href^="#"]').forEach(anchor => {
      anchor.addEventListener('click', function (e) {
        e.preventDefault();
        const target = document.querySelector(this.getAttribute('href'));
        if (target) {
          target.scrollIntoView({ behavior: 'smooth' });
        }
      });
    });

    // Portfolio filtering
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
      });
    });
  </script>
</body>
</html>
